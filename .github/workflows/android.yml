name: Build and test

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - name: Build youtubedl-android 0.18.1 AARs (Python 3.11 engine)
        run: |
          git clone --depth 1 --branch 0.18.1 https://github.com/yausername/youtubedl-android.git /tmp/ydla
          cd /tmp/ydla
          chmod +x gradlew
          ./gradlew :library:assembleRelease :common:assembleRelease :ffmpeg:assembleRelease --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp library/build/outputs/aar/library-release.aar common/build/outputs/aar/common-release.aar ffmpeg/build/outputs/aar/ffmpeg-release.aar "$GITHUB_WORKSPACE/app/libs/"
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest --stacktrace
      - name: Build release APKs (per-ABI)
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          NZEL_KEYSTORE_B64: ${{ secrets.NZEL_KEYSTORE_B64 }}
          NZEL_STORE_PASSWORD: ${{ secrets.NZEL_STORE_PASSWORD }}
          NZEL_KEY_ALIAS: ${{ secrets.NZEL_KEY_ALIAS }}
          NZEL_KEY_PASSWORD: ${{ secrets.NZEL_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: nzel-apks
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v1.0.0-b${{ github.run_number }}"
          gh release create "$tag" app/build/outputs/apk/release/app-arm64-v8a-release.apk app/build/outputs/apk/release/app-armeabi-v7a-release.apk \
            --title "Nzel $tag" --notes "Automated CI build. Install the APK matching your phone (most phones: arm64-v8a)." --latest || true

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nzel-apks
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash ci/run_emulator_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nzel-emulator-test
          path: test-artifacts/
          retention-days: 14
